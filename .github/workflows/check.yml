name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm test
      - run: npm run build
      - run: npm run format:check
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # При ошибке diff попадает в аннотацию — его видно на странице проверки без открытия лога.
      - name: cargo fmt --check
        shell: bash
        run: |
          if ! out=$(cargo fmt --manifest-path src-tauri/Cargo.toml --check -- --color never 2>&1); then
            echo "$out"
            out="${out//'%'/'%25'}"
            out="${out//$'\r'/'%0D'}"
            out="${out//$'\n'/'%0A'}"
            echo "::error title=cargo fmt::$out"
            exit 1
          fi
      # generate_context! встраивает ../dist, поэтому фронтенд собирается до clippy.
      - run: npm ci
      - run: npm run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
