name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches app version
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Тег $GITHUB_REF_NAME не совпадает с версией $version"; exit 1; }
          test -f "docs/releases/$GITHUB_REF_NAME.md" || { echo "Нет docs/releases/$GITHUB_REF_NAME.md"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run version:check
      - run: npm test
      - name: Signing key is configured
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Добавьте секрет TAURI_SIGNING_PRIVATE_KEY — без подписи программы не смогут обновиться"; exit 1; }
      - name: Build signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run installer -- --config src-tauri/tauri.release.conf.json
      - name: Collect files
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release
          setup="src-tauri/target/release/bundle/nsis/Teacher Companion_${version}_x64-setup.exe"
          cp "$setup" release/TeacherCompanion-Setup.exe
          node scripts/latest-json.mjs "$GITHUB_REF_NAME" "$setup.sig" release/latest.json
          cp src-tauri/target/release/teacher-companion.exe release/TeacherCompanion-Portable.exe
          (cd release && sha256sum *.exe | sed 's/ \*/  /' > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          release/TeacherCompanion-Setup.exe release/TeacherCompanion-Portable.exe release/SHA256SUMS.txt release/latest.json
          --title "Помощник учителя ${GITHUB_REF_NAME}"
          --notes-file "docs/releases/$GITHUB_REF_NAME.md"
